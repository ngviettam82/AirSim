stages:
  - checks
  - build
  - package

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UE_ROOT: 'C:\Program Files\Epic Games\UE_5.5'
  TARGET_PLATFORMS: "Win64"
  PACKAGE_DIR: "$CI_PROJECT_DIR\\artifacts\\AirSimPlugin"
  PACKAGE_ZIP: "$CI_PROJECT_DIR\\artifacts\\AirSimPlugin-Win64.zip"

cache:
  paths:
    - .cache/pip/

repo_checks:
  stage: checks
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip build mkdocs PyYAML
  script:
    - python tools/ci/check_repo_text.py
    - |
      python - <<'PY'
      from pathlib import Path
      import yaml

      workflow_paths = list(Path(".github/workflows").glob("*.yml")) + [Path(".gitlab-ci.yml")]
      for workflow in workflow_paths:
          with workflow.open("r", encoding="utf-8") as handle:
              yaml.safe_load(handle)
          print(f"validated {workflow}")
      PY
    - python -m compileall -q PythonClient tools/ci
    - python -m build PythonClient
    - mkdocs build --strict

build_linux:
  stage: build
  image: $UBUNTU_IMAGE
  parallel:
    matrix:
      - UBUNTU_IMAGE:
          - ubuntu:22.04
          - ubuntu:24.04
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends bash ca-certificates git sudo python3
  script:
    - bash setup.sh --no-full-poly-car
    - bash build.sh
    - ./build_release/output/bin/MavLinkTest --help

build_windows:
  stage: build
  tags:
    - windows
    - vs2022
  rules:
    - if: $RUN_WINDOWS_CI == "true"
    - when: manual
      allow_failure: true
  script:
    - cmd.exe /d /s /c "\"%ProgramFiles%\Microsoft Visual Studio\2022\Community\Common7\Tools\VsDevCmd.bat\" -arch=x64 && build.cmd --no-full-poly-car --Release"
    - powershell -NoProfile -ExecutionPolicy Bypass -Command "$paths = @('AirLib\deps\rpclib\lib\x64\Release', 'AirLib\deps\MavLinkCom\lib', 'Unreal\Plugins\AirSim\Source\AirLib\deps'); foreach ($path in $paths) { if (-not (Test-Path $path)) { throw \"Missing build output: $path\" } }"

package_unreal_windows:
  stage: package
  tags:
    - windows
    - unreal
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - when: never
  script:
    - cmd.exe /d /s /c "\"%ProgramFiles%\Microsoft Visual Studio\2022\Community\Common7\Tools\VsDevCmd.bat\" -arch=x64 && build.cmd --no-full-poly-car --Release"
    - cd Unreal\Environments\Blocks
    - cmd.exe /d /s /c "update_from_git.bat ..\..\.."
    - cd ..\..\..
    - powershell -NoProfile -ExecutionPolicy Bypass -Command "$batchFiles = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles'; $build = Join-Path $batchFiles 'Build.bat'; $runUat = Join-Path $batchFiles 'RunUAT.bat'; if (-not (Test-Path $build)) { throw \"Build.bat not found at $build\" }; if (-not (Test-Path $runUat)) { throw \"RunUAT.bat not found at $runUat\" }; & $build BlocksEditor Win64 Development -Project=\"$PWD\Unreal\Environments\Blocks\Blocks.uproject\" -WaitMutex -NoHotReload; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $plugin = Join-Path $PWD 'Unreal\Environments\Blocks\Plugins\AirSim\AirSim.uplugin'; if (Test-Path $env:PACKAGE_DIR) { Remove-Item -LiteralPath $env:PACKAGE_DIR -Recurse -Force }; & $runUat BuildPlugin -Plugin=\"$plugin\" -Package=\"$env:PACKAGE_DIR\" -Rocket -TargetPlatforms=\"$env:TARGET_PLATFORMS\"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; if (Test-Path $env:PACKAGE_ZIP) { Remove-Item -LiteralPath $env:PACKAGE_ZIP -Force }; Compress-Archive -Path \"$env:PACKAGE_DIR\*\" -DestinationPath $env:PACKAGE_ZIP"
  artifacts:
    name: "AirSimPlugin-Win64-$CI_COMMIT_SHORT_SHA"
    paths:
      - artifacts/AirSimPlugin-Win64.zip
    expire_in: 14 days
