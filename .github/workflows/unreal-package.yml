name: Unreal Plugin Package

on:
  workflow_dispatch:
    inputs:
      ue_root:
        description: Unreal Engine installation root
        required: true
        default: "C:\\Program Files\\Epic Games\\UE_5.5"
      target_platforms:
        description: RunUAT BuildPlugin target platforms
        required: true
        default: Win64
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: unreal-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package_windows_plugin:
    name: Package AirSim plugin for Windows
    runs-on:
      - self-hosted
      - Windows
      - X64
      - unreal

    env:
      UE_ROOT: ${{ github.event.inputs.ue_root || 'C:\Program Files\Epic Games\UE_5.5' }}
      TARGET_PLATFORMS: ${{ github.event.inputs.target_platforms || 'Win64' }}
      PACKAGE_DIR: ${{ github.workspace }}\artifacts\AirSimPlugin
      PACKAGE_ZIP: ${{ github.workspace }}\artifacts\AirSimPlugin-Win64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify Unreal Engine
        shell: pwsh
        run: |
          $batchFiles = Join-Path $env:UE_ROOT "Engine\Build\BatchFiles"
          $runUat = Join-Path $batchFiles "RunUAT.bat"
          $build = Join-Path $batchFiles "Build.bat"
          if (-not (Test-Path $runUat)) {
            throw "RunUAT.bat not found at $runUat"
          }
          if (-not (Test-Path $build)) {
            throw "Build.bat not found at $build"
          }

      - name: Build AirLib
        shell: cmd
        run: build.cmd --no-full-poly-car --Release

      - name: Sync plugin into Blocks project
        shell: cmd
        working-directory: Unreal\Environments\Blocks
        run: update_from_git.bat ..\..\..

      - name: Build Blocks editor target
        shell: pwsh
        working-directory: Unreal\Environments\Blocks
        run: |
          $build = Join-Path $env:UE_ROOT "Engine\Build\BatchFiles\Build.bat"
          & $build BlocksEditor Win64 Development -Project="$PWD\Blocks.uproject" -WaitMutex -NoHotReload
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Package plugin
        shell: pwsh
        run: |
          $runUat = Join-Path $env:UE_ROOT "Engine\Build\BatchFiles\RunUAT.bat"
          $plugin = Join-Path $PWD "Unreal\Environments\Blocks\Plugins\AirSim\AirSim.uplugin"
          if (Test-Path $env:PACKAGE_DIR) {
            Remove-Item -LiteralPath $env:PACKAGE_DIR -Recurse -Force
          }
          & $runUat BuildPlugin -Plugin="$plugin" -Package="$env:PACKAGE_DIR" -Rocket -TargetPlatforms="$env:TARGET_PLATFORMS"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Compress package
        shell: pwsh
        run: |
          if (Test-Path $env:PACKAGE_ZIP) {
            Remove-Item -LiteralPath $env:PACKAGE_ZIP -Force
          }
          Compress-Archive -Path "$env:PACKAGE_DIR\*" -DestinationPath $env:PACKAGE_ZIP

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSimPlugin-Win64
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error

      - name: Attach package to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE_ZIP }}
